# migrator: strategy.matrix (include: - language: java-kotlin build-mode: none # This ...): matrix include lists are not expanded; job not carried
# migrator: on.pull_request.types (opened, reopened, synchronize, ready_for_review): presubmit has no activity-type filter; jobs run on every pull-request update
# migrator: network (NETWORK_MODE_EXTERNAL, no egress allowlist): GitHub runners have unrestricted egress; dry output is hermetic until the proof run records an egress allowlist
version: 1
checks:
  # migrator: uses (advanced-security/maven-dependency-submission-action@a643...): step "Update dependency graph": third-party action has no Chainguard mapping yet; step dropped
  # migrator: uses (SecObserve/secobserve_actions_templates/actions/upload_sb...): step "Upload SBOM": third-party action has no Chainguard mapping yet; step dropped
  build:
    environment:
      packages:
      - openjdk-17
    steps:
    - cmd:
      - sh
      - -e
      - -c
      - mvn -B package --file pom.xml
      name: Build with Maven
  # migrator: if (github.event.pull_request.user.login == 'dependabot[bot]'...): the schema has no job gate; job carried unconditionally
  # migrator: env (GH_TOKEN): secrets have no target yet (build item 1); variable dropped
  # migrator: env (PR_NUMBER=${{ github.event.pull_request.number }}): interpolated value; the schema has no expressions; variable dropped
  # migrator: env (PR_URL=${{ github.event.pull_request.html_url }}): interpolated value; the schema has no expressions; variable dropped
  # migrator: uses (dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe...): step "metadata": third-party action has no Chainguard mapping yet; step dropped
  # migrator: step env (GH_TOKEN): secrets have no target yet (build item 1); variable dropped
  # migrator: step env (COMMENTS=${{ steps.review.outputs.comments }}): interpolated value; the schema has no expressions; variable dropped
  # migrator: step env (MAINTAINER_CHANGES=${{ steps.metadata.outputs.maintainer-...): interpolated value; the schema has no expressions; variable dropped
  # migrator: step env (SCOPE_SAFE=${{ steps.scope.outputs.safe }}): interpolated value; the schema has no expressions; variable dropped
  # migrator: step env (VERDICT=${{ steps.review.outputs.verdict }}): interpolated value; the schema has no expressions; variable dropped
  # migrator: run ({ echo "### Dependabot update" echo echo "| Field | Value...): step "Summary" interpolates ${{ }}; the schema has no expressions; step dropped
  # migrator: step if (steps.decide.outputs.merge != 'true'): step "Hold auto-merge" has a conditional the schema cannot express; step dropped
  # migrator: step if (steps.decide.outputs.merge == 'true'): step "Enable auto-merge" has a conditional the schema cannot express; step dropped
  dependabot:
    environment: {}
    steps:
    - cmd:
      - sh
      - -e
      - -c
      - |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::COPILOT_REVIEW_TOKEN is not set; Copilot review cannot be requested."
          exit 1
        fi
        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
          -f 'reviewers[]=copilot-pull-request-reviewer[bot]' > /dev/null
        # Copilot never appears in `requested_reviewers`, so confirm via the timeline.
        for _ in $(seq 1 6); do
          if gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" --paginate \
               --jq '.[] | select(.event == "review_requested") | .requested_reviewer.login // empty' \
             | grep -qix 'copilot'; then
            echo "Copilot review requested."
            exit 0
          fi
          sleep 5
        done
        echo "::error::Copilot review request was not registered. Check that COPILOT_REVIEW_TOKEN belongs to a Copilot-licensed user."
        exit 1
      name: Request Copilot code review
    - cmd:
      - sh
      - -e
      - -c
      - |
        verdict=none
        for _ in $(seq 1 40); do
          state=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate \
            --jq '[.[] | select(.user.login == "copilot-pull-request-reviewer[bot]")] | last | .state // empty')
          if [ -n "$state" ]; then
            verdict="$state"
            break
          fi
          sleep 15
        done
        comments=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" --paginate \
          --jq '[.[] | select(.user.login == "copilot-pull-request-reviewer[bot]")] | length')
        {
          echo "verdict=$verdict"
          echo "comments=$comments"
        } >> "$GITHUB_OUTPUT"
        echo "Copilot verdict: $verdict ($comments inline comments)"
      id: review
      name: Wait for the Copilot review
    - cmd:
      - sh
      - -e
      - -c
      - |
        files=$(gh pr view "$PR_URL" --json files --jq '.files[].path')
        echo "$files"
        unexpected=$(printf '%s\n' "$files" | grep -Ev '^(pom\.xml|Dockerfile|\.github/workflows/[^/]+\.ya?ml|\.github/dependabot\.yml|devbox\.(json|lock)|trekktabell\.yaml)$' || true)
        if [ -n "$unexpected" ]; then
          {
            echo "### Dependabot PR touches unexpected files"
            echo
            printf '%s\n' "$unexpected" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "safe=false" >> "$GITHUB_OUTPUT"
        else
          echo "safe=true" >> "$GITHUB_OUTPUT"
        fi
      id: scope
      name: Check that the diff only touches dependency manifests
    - cmd:
      - sh
      - -e
      - -c
      - |
        ok=true
        : > reasons.md
        if [ "$VERDICT" != "APPROVED" ]; then
          ok=false
          echo "- Copilot review verdict is \`$VERDICT\`, not \`APPROVED\`." >> reasons.md
        fi
        if [ "$COMMENTS" != "0" ]; then
          ok=false
          echo "- Copilot left $COMMENTS inline comment(s)." >> reasons.md
        fi
        if [ "$SCOPE_SAFE" != "true" ]; then
          ok=false
          echo "- The diff touches files outside the dependency manifests." >> reasons.md
        fi
        if [ "$MAINTAINER_CHANGES" = "true" ]; then
          ok=false
          echo "- Dependabot reports maintainer changes between the two versions." >> reasons.md
        fi
        echo "merge=$ok" >> "$GITHUB_OUTPUT"
      id: decide
      name: Decide

